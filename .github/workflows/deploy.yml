name: CI/CD Pipeline - Catalogo Tom Hanks

on:
  push:
    branches: [ "main" ]

permissions:
  contents: read
  packages: write

jobs:
  # 1. ETAPA DE CI: TESTES AUTOMATIZADOS (REQUISITO 1)
  test:
    name: CI - Testes Automatizados
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar Dependências de Teste
        run: |
          python -m pip install --upgrade pip
          if [ -f catalogo_service/requirements.txt ]; then pip install -r catalogo_service/requirements.txt; fi
          pip install pytest httpx pymysql

      - name: Executar Testes com Pytest
        run: |
          cd catalogo_service
          pytest -v test_main.py

  # 2. ETAPA DE CD: BUILD E PUBLICAÇÃO NO GHCR COM TAG RASTREÁVEL (REQUISITOS 2 E 3)
  build-and-push:
    name: CD - Build e Publicação no GHCR
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4

      - name: Extrair SHA curto do Commit
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Converter nome do repositório para minúsculas
        id: repo
        run: echo "name_lower=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Autenticar no GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extrair Metadados do Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ steps.repo.outputs.name_lower }}/catalogo_service
          tags: |
            type=raw,value=latest
            type=raw,value=sha-${{ steps.vars.outputs.sha_short }}

      - name: Build e Push da Imagem Docker
        uses: docker/build-push-action@v5
        with:
          context: ./catalogo_service
          file: ./catalogo_service/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}